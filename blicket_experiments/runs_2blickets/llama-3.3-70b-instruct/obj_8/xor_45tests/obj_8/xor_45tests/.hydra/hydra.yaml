hydra:
  run:
    dir: runs_2blickets/llama-3.3-70b-instruct/obj_8/xor_45tests/obj_8/xor_45tests
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=runs_2blickets/llama-3.3-70b-instruct/obj_8/xor_45tests/obj_8/xor_45tests
    - hydra.mode=RUN
    task:
    - model_name=llama-3.3-70b-instruct/obj_8/xor_45tests
    - num_trials=16
    - seed=0
    - env_kwargs.rule=xor
    - env_kwargs.num_objects=8
    - env_kwargs.num_blickets=2
    - max_actions_per_trial=45
    - agent.model=local_vllm:/scratch/aj4332/models/llama-3.3-70b-instruct
    - agent.thinking_mode=False
    - agent.initial_msg_path=./agent/prompts/alternating_relevant_initial.txt
  job:
    name: run_trials_blicket_oracle_alternating
    chdir: true
    override_dirname: agent.initial_msg_path=./agent/prompts/alternating_relevant_initial.txt,agent.model=local_vllm:/scratch/aj4332/models/llama-3.3-70b-instruct,agent.thinking_mode=False,env_kwargs.num_blickets=2,env_kwargs.num_objects=8,env_kwargs.rule=xor,max_actions_per_trial=45,model_name=llama-3.3-70b-instruct/obj_8/xor_45tests,num_trials=16,seed=0
    id: ???
    num: ???
    config_name: run_trials_blicket_oracle_alternating
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /scratch/aj4332/cb_env/blicket-text-llm
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /scratch/aj4332/cb_env/blicket-text-llm
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /scratch/aj4332/cb_env/blicket-text-llm/runs_2blickets/llama-3.3-70b-instruct/obj_8/xor_45tests/obj_8/xor_45tests
    choices:
      agent: alternating_blicket_oracle_llm
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
