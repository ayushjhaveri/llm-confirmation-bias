rules:
  # P1: [4, 6, 8]
  - { id: P1_1,  name: "strictly increasing",          expr: "a < b < c", family: order }
  - { id: P1_2,  name: "non-decreasing",               expr: "a <= b <= c", family: order }
  - { id: P1_3,  name: "all positive",                 expr: "a > 0 and b > 0 and c > 0", family: sign }
  - { id: P1_4,  name: "all even",                     expr: "a%2==0 and b%2==0 and c%2==0", family: parity }
  - { id: P1_5,  name: "sum is even",                  expr: "(a+b+c)%2==0", family: arithmetic }
  - { id: P1_6,  name: "max is last",                  expr: "c >= a and c >= b", family: order }
  - { id: P1_7,  name: "min is first",                 expr: "a <= b and a <= c", family: order }
  - { id: P1_8,  name: "arithmetic progression",       expr: "(b-a)==(c-b)", family: differences }
  - { id: P1_9,  name: "at least one multiple of 3",   expr: "(a%3==0) or (b%3==0) or (c%3==0)", family: divisibility }
  - { id: P1_10, name: "no duplicates",                expr: "len({a,b,c})==3", family: equality }
  - { id: P1_11, name: "at least one even",            expr: "(a%2==0) or (b%2==0) or (c%2==0)", family: parity }
  - { id: P1_12, name: "all non-zero",                 expr: "a!=0 and b!=0 and c!=0", family: zero }

